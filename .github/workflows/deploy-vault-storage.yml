name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  my-frontend-deploy:
    runs-on: ubuntu-latest

    env:
      S3_BUCKET_NAME: yourvaultstoragefrontend
      CLOUDFRONT_DISTRIBUTION_ID: E1GUK9KTGYZNFE
      AWS_REGION: ap-south-1

      # Basic Frontend Environment Variables for Vite Build
      VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL || vars.VITE_SERVER_URL || '/api' }}
      VITE_MAX_FILE_SIZE: ${{ vars.VITE_MAX_FILE_SIZE || '104857600' }}
      VITE_GOOGLE_CLIENTID: ${{ secrets.VITE_GOOGLE_CLIENTID || vars.VITE_GOOGLE_CLIENTID }}
      VITE_GITHUB_CLIENTID: ${{ secrets.VITE_GITHUB_CLIENTID || vars.VITE_GITHUB_CLIENTID }}
      VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID || vars.VITE_RAZORPAY_KEY_ID }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'yourvaultstorage.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'yourvaultstorage' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'yourvaultstorage.firebasestorage.app' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout my-storage
        uses: actions/checkout@v4
        with:
          repository: adarshbam/my-storage

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Dependencies
        run: |
          if [ -f "Frontend/package.json" ]; then
            cd Frontend
            npm ci
          fi

      - name: Run Automated Dummy Test
        run: |
          if [ -f "Frontend/package.json" ]; then
            cd Frontend
          fi
          npm run test

      - name: Build Frontend Application
        run: |
          if [ -f "Frontend/package.json" ]; then
            cd Frontend
          fi
          npm run build

      - name: Sync Build to S3 Bucket
        run: |
          DIST_DIR="./dist"
          if [ -d "Frontend/dist" ]; then
            DIST_DIR="Frontend/dist"
          fi
          aws s3 sync "$DIST_DIR" "s3://${{ env.S3_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
  my-backend-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1

      # ------------------------------------------------------------------------
      # 1. Server Configuration
      # ------------------------------------------------------------------------
      PORT: ${{ vars.PORT || '4000' }}
      NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
      BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || 'https://yourvaultstorage.com/api' }}
      CLIENT_URL: ${{ secrets.CLIENT_URL || vars.CLIENT_URL || 'https://yourvaultstorage.com' }}

      # ------------------------------------------------------------------------
      # 2. Database & Cache Configuration
      # ------------------------------------------------------------------------
      DB_URL: ${{ secrets.DB_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

      # ------------------------------------------------------------------------
      # 3. Security & Limit Configuration
      # ------------------------------------------------------------------------
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      MAX_DEVICES_LIMIT: ${{ vars.MAX_DEVICES_LIMIT || '3' }}
      MAX_FILE_SIZE: ${{ vars.MAX_FILE_SIZE || '104857600' }}

      # ------------------------------------------------------------------------
      # 4. Google Auth / API Integration
      # ------------------------------------------------------------------------
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # ------------------------------------------------------------------------
      # 5. GitHub OAuth & Webhook Integration
      # ------------------------------------------------------------------------
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || vars.GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}

      # ------------------------------------------------------------------------
      # 6. Razorpay Payment Gateway
      # ------------------------------------------------------------------------
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

      # ------------------------------------------------------------------------
      # 7. Object Storage (Backblaze B2 / S3 Compatible)
      # ------------------------------------------------------------------------
      BACKBLAZE_ACCESS_KEY_ID: ${{ secrets.BACKBLAZE_ACCESS_KEY_ID || vars.BACKBLAZE_ACCESS_KEY_ID }}
      BACKBLAZE_SECRET_ACCESS_KEY: ${{ secrets.BACKBLAZE_SECRET_ACCESS_KEY }}
      BACKBLAZE_ENDPOINT: ${{ secrets.BACKBLAZE_ENDPOINT || vars.BACKBLAZE_ENDPOINT || 'https://s3.ca-east-006.backblazeb2.com' }}
      BACKBLAZE_REGION: ${{ vars.BACKBLAZE_REGION || 'ca-east-006' }}
      BACKBLAZE_BUCKET_NAME: ${{ vars.BACKBLAZE_BUCKET_NAME || 'secure-vault-storage' }}

      # ------------------------------------------------------------------------
      # 8. Cloudflare Edge CDN
      # ------------------------------------------------------------------------
      CLOUDFLARE_CDN_DOMAIN: ${{ secrets.CLOUDFLARE_CDN_DOMAIN || vars.CLOUDFLARE_CDN_DOMAIN || 'https://cdn.yourvaultstorage.com' }}
      CLOUDFLARE_CDN_SECRET: ${{ secrets.CLOUDFLARE_CDN_SECRET }}

      # ------------------------------------------------------------------------
      # 9. Firebase Admin
      # ------------------------------------------------------------------------
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || 'yourvaultstorage' }}

      # ------------------------------------------------------------------------
      # 10. Email Service (SMTP / Nodemailer)
      # ------------------------------------------------------------------------
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Setup SSH with EC2 of MY Storage
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/my-key.pem
          chmod 600 ~/.ssh/my-key.pem
          cat > ~/.ssh/config <<'EOF'
          Host yourvaultstorage
              HostName 13.207.230.92
              User ubuntu
              IdentityFile ~/.ssh/yourvaultstorage.pem
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy using SSH EC@ of My Storage
        run: |
          ssh securevault << 'EOF'
            # Stage 1/4: Git Synchronization
            # ------------------------------------------------------------------------------
            echo ""
            echo "📥 [1/4] Syncing latest changes from git origin/${BRANCH}..."
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            git clean -fd -e ".env" -e "node_modules"
            SYNCED_HASH=$(git rev-parse --short HEAD)
            SYNCED_MSG=$(git log -1 --pretty=format:"%s")
            echo "✅ Synced to Git Commit: [${SYNCED_HASH}]"
            echo "💬 Latest Commit:        \"${SYNCED_MSG}\""

            echo "⚙️ [] Updating Backend & Reloading PM2 Cluster (Zero-Downtime)..."
            cd "$PROJECT_DIR/Backend"
            if [ ! -d "node_modules" ]; then
              echo "📦 [Backend] Installing backend dependencies..."
              npm install --omit=dev
            else
              echo "⚡ [Backend] Dependencies verified. Skipping re-install."
            fi

            cd "$PROJECT_DIR"
            if [ -f "ecosystem.config.cjs" ]; then
              pm2 reload ecosystem.config.cjs --update-env || pm2 reload vault-backend --update-env
            else
              pm2 reload vault-backend --update-env
            fi
            echo "✅ Backend PM2 cluster reloaded with zero downtime."

            echo ""
            echo "=================================================================="
            echo "🎉 [EC2 Remote Runner] Full Stack Deployment for my-storage [${COMMIT_ID:0:7}] Completed Successfully!"
            echo "=================================================================="
            EOF
